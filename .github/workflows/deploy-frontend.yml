name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y publicar en S3 + CloudFront
    # Sin infraestructura configurada (variables del repo vacías) no hay nada que desplegar.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC
    defaults:
      run:
        working-directory: frontend
    env:
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 1. Archivos con hash en el nombre: caché de un año. Sin --delete a propósito: las pestañas
      #    abiertas con la versión anterior siguen pudiendo cargar sus chunks.
      - name: Subir assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"

      # 2. index.html y el resto: siempre se revalidan, para que la versión nueva se vea al momento.
      - name: Subir index.html y archivos sin hash
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidar CloudFront
        run: |
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          echo "Invalidación $invalidation_id creada" >> "$GITHUB_STEP_SUMMARY"
