name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez; uno nuevo espera al anterior en lugar de cancelarlo.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://todo:todo@localhost:5432/todo_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest

  deploy:
    name: Build, push y deploy
    needs: test
    # Sin infraestructura configurada (variables del repo vacías) no hay nada que desplegar.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: credenciales temporales de AWS sin llaves guardadas
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ github.sha }}
      # La EC2 por defecto es t4g (ARM). Si usas t3, crea la variable DOCKER_PLATFORM=linux/amd64.
      DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/arm64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Las etiquetas de ECR son inmutables: al relanzar un deploy del mismo commit no se reconstruye.
      - name: ¿Ya existe la imagen?
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "La imagen $IMAGE_TAG ya está en ECR; se reutiliza."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-qemu-action@v4

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          provenance: false # una sola imagen por etiqueta (sin índices de atestaciones en ECR)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ejecutar deploy.sh en la EC2 (SSM)
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG:0:7}" \
            --parameters "commands=['/opt/todo/deploy.sh $IMAGE_TAG']" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "Comando SSM: $command_id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "::group::Salida de deploy.sh"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "::endgroup::"

          if [ "$status" != "Success" ]; then
            echo "::error::El despliegue terminó con estado $status (si hubo rollback, sigue la versión anterior)."
            exit 1
          fi
          echo "Desplegado ${IMAGE_TAG:0:7}" >> "$GITHUB_STEP_SUMMARY"
