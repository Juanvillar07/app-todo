<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#f6f8fb;font-family:Helvetica,Arial,sans-serif;color:#1e2a46">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e3e8ef;border-radius:12px">
          <tr><td style="padding:32px">
            <p style="margin:0 0 24px;font-size:15px;font-weight:600">

            </p>
            <a href="$link" style="display:inline-block;padding:10px 18px;border-radius:8px;background:#5b47e0;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none">

              <a href="$link" style="color:#5b47e0;word-break:break-all">$link</a>

          </td></tr>
        </table>
